
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SupaDash | Database Manager</title>
    
    <!-- Tailwind CSS for Unique Styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React and Babel CDNs to run React in HTML -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Supabase JS Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .glass-panel {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #475569; border-radius: 10px; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100">

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // SVG Icon Components to replace Lucide-React for HTML CDN version
        const Icons = {
            Database: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5V19A9 3 0 0 0 21 19V5"/><path d="M3 12A9 3 0 0 0 21 12"/></svg>,
            Plus: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 5v14M5 12h14"/></svg>,
            Trash: () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>,
            Refresh: () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M3 21v-5h5"/></svg>,
            Settings: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>,
            Check: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"/></svg>,
            Alert: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>,
        };

        function App() {
            const [supabaseUrl, setSupabaseUrl] = useState('');
            const [supabaseKey, setSupabaseKey] = useState('');
            const [tableName, setTableName] = useState('');
            const [isConnected, setIsConnected] = useState(false);
            const [supabaseClient, setSupabaseClient] = useState(null);
            const [data, setData] = useState([]);
            const [loading, setLoading] = useState(false);
            const [message, setMessage] = useState({ type: '', text: '' });
            const [newItem, setNewItem] = useState('');

            const showMsg = (type, text) => {
                setMessage({ type, text });
                setTimeout(() => setMessage({ type: '', text: '' }), 4000);
            };

            const connectDb = () => {
                if (!supabaseUrl || !supabaseKey || !tableName) {
                    showMsg('error', 'Please fill in all configuration fields');
                    return;
                }
                try {
                    const client = supabase.createClient(supabaseUrl, supabaseKey);
                    setSupabaseClient(client);
                    setIsConnected(true);
                    showMsg('success', 'Connected to Supabase successfully!');
                } catch (err) {
                    showMsg('error', 'Connection failed: ' + err.message);
                }
            };

            const fetchData = async () => {
                if (!supabaseClient) return;
                setLoading(true);
                try {
                    const { data: rows, error } = await supabaseClient.from(tableName).select('*');
                    if (error) throw error;
                    setData(rows);
                } catch (err) {
                    showMsg('error', 'Fetch Error: ' + err.message);
                } finally {
                    setLoading(false);
                }
            };

            const addItem = async () => {
                if (!supabaseClient || !newItem) return;
                try {
                    const parsedData = JSON.parse(newItem.replace(/'/g, '"'));
                    const { error } = await supabaseClient.from(tableName).insert([parsedData]);
                    if (error) throw error;
                    showMsg('success', 'Record added successfully!');
                    setNewItem('');
                    fetchData();
                } catch (err) {
                    showMsg('error', 'Invalid JSON or Insert Error: ' + err.message);
                }
            };

            const deleteItem = async (id) => {
                try {
                    const { error } = await supabaseClient.from(tableName).delete().eq('id', id);
                    if (error) throw error;
                    showMsg('success', 'Record deleted!');
                    fetchData();
                } catch (err) {
                    showMsg('error', 'Delete Error: ' + err.message);
                }
            };

            return (
                <div className="min-h-screen p-4 md:p-8">
                    <header className="max-w-6xl mx-auto flex items-center justify-between mb-10">
                        <div className="flex items-center gap-3">
                            <div className="bg-indigo-600 p-2 rounded-xl shadow-lg shadow-indigo-500/40">
                                <Icons.Database />
                            </div>
                            <h1 className="text-3xl font-bold tracking-tight">Supa<span className="text-indigo-400">Dash</span></h1>
                        </div>
                        <div className="flex items-center gap-3 bg-slate-800 px-4 py-2 rounded-full border border-slate-700">
                            <div className={`h-2 w-2 rounded-full ${isConnected ? 'bg-green-500 animate-pulse' : 'bg-red-500'}`}></div>
                            <span className="text-xs font-medium text-slate-400">{isConnected ? 'CONNECTED' : 'DISCONNECTED'}</span>
                        </div>
                    </header>

                    <main className="max-w-6xl mx-auto grid grid-cols-1 lg:grid-cols-4 gap-8">
                        {/* Configuration Sidebar */}
                        <div className="lg:col-span-1 space-y-6">
                            <div className="glass-panel p-6 rounded-3xl shadow-2xl">
                                <div className="flex items-center gap-2 mb-6 text-indigo-400">
                                    <Icons.Settings />
                                    <h2 className="font-bold uppercase text-xs tracking-widest">Database Settings</h2>
                                </div>
                                
                                <div className="space-y-4">
                                    <div>
                                        <label className="block text-[10px] uppercase font-bold text-slate-500 mb-1 ml-1">Supabase URL</label>
                                        <input 
                                            className="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm focus:ring-2 focus:ring-indigo-500 outline-none transition-all placeholder:text-slate-600"
                                            placeholder="https://xyz.supabase.co"
                                            value={supabaseUrl}
                                            onChange={(e) => setSupabaseUrl(e.target.value)}
                                        />
                                    </div>
                                    <div>
                                        <label className="block text-[10px] uppercase font-bold text-slate-500 mb-1 ml-1">Anon Key</label>
                                        <input 
                                            className="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm focus:ring-2 focus:ring-indigo-500 outline-none transition-all placeholder:text-slate-600"
                                            type="password"
                                            placeholder="eyJhbG..."
                                            value={supabaseKey}
                                            onChange={(e) => setSupabaseKey(e.target.value)}
                                        />
                                    </div>
                                    <div>
                                        <label className="block text-[10px] uppercase font-bold text-slate-500 mb-1 ml-1">Table Name</label>
                                        <input 
                                            className="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm focus:ring-2 focus:ring-indigo-500 outline-none transition-all placeholder:text-slate-600"
                                            placeholder="profiles"
                                            value={tableName}
                                            onChange={(e) => setTableName(e.target.value)}
                                        />
                                    </div>
                                    <button 
                                        onClick={connectDb}
                                        className="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3 rounded-xl transition-all flex items-center justify-center gap-2 shadow-lg shadow-indigo-600/30 active:scale-95"
                                    >
                                        <Icons.Database /> Connect Now
                                    </button>
                                </div>
                            </div>

                            {message.text && (
                                <div className={`p-4 rounded-2xl flex items-center gap-3 border animate-bounce transition-all ${
                                    message.type === 'success' ? 'bg-emerald-900/20 border-emerald-500 text-emerald-400' : 'bg-red-900/20 border-red-500 text-red-400'
                                }`}>
                                    {message.type === 'success' ? <Icons.Check /> : <Icons.Alert />}
                                    <p className="text-sm font-medium">{message.text}</p>
                                </div>
                            )}
                        </div>

                        {/* Content Area */}
                        <div className="lg:col-span-3 space-y-6">
                            {!isConnected ? (
                                <div className="h-full min-h-[400px] flex flex-col items-center justify-center text-slate-500 border-2 border-dashed border-slate-800 rounded-3xl p-12 text-center">
                                    <div className="bg-slate-800 p-6 rounded-full mb-4 opacity-50">
                                        <Icons.Database />
                                    </div>
                                    <p className="text-xl font-medium">Ready to connect</p>
                                    <p className="text-sm opacity-60">Enter your Supabase credentials in the sidebar to start managing your data</p>
                                </div>
                            ) : (
                                <>
                                    <div className="glass-panel p-4 rounded-3xl flex flex-wrap items-center justify-between gap-4">
                                        <button 
                                            onClick={fetchData} 
                                            className="flex items-center gap-2 px-5 py-2 bg-slate-700 hover:bg-slate-600 rounded-xl text-sm font-medium transition-all active:scale-95"
                                        >
                                            <div className={loading ? 'animate-spin' : ''}><Icons.Refresh /></div> Refresh Data
                                        </button>

                                        <div className="flex gap-2 items-center bg-slate-900 p-1 rounded-2xl border border-slate-700">
                                            <input 
                                                className="bg-transparent border-none outline-none p-2 text-sm w-64 px-3"
                                                placeholder="Enter JSON (e.g. {'name': 'John'})"
                                                value={newItem}
                                                onChange={(e) => setNewItem(e.target.value)}
                                            />
                                            <button 
                                                onClick={addItem}
                                                className="bg-emerald-600 hover:bg-emerald-500 p-2 rounded-xl transition-all text-white active:scale-90"
                                            >
                                                <Icons.Plus />
                                            </button>
                                        </div>
                                    </div>

                                    <div className="glass-panel rounded-3xl overflow-hidden shadow-2xl">
                                        <div className="overflow-x-auto custom-scrollbar">
                                            <table className="w-full text-left border-collapse">
                                                <thead>
                                                    <tr className="bg-slate-800/50 text-slate-400 text-[10px] uppercase tracking-widest font-bold">
                                                        <th className="p-5">Row ID</th>
                                                        <th className="p-5">Record Content</th>
                                                        <th className="p-5 text-right">Actions</th>
                                                    </tr>
                                                </thead>
                                                <tbody className="divide-y divide-slate-800">
                                                    {data.length === 0 && !loading && (
                                                        <tr>
                                                            <td colSpan="3" className="p-20 text-center text-slate-500 italic">No records found in table "{tableName}"</td>
                                                        </tr>
                                                    )}
                                                    {data.map((row) => (
                                                        <tr key={row.id} className="hover:bg-slate-700/30 transition-colors group">
                                                            <td className="p-5 text-sm font-mono text-indigo-400 font-semibold">{row.id}</td>
                                                            <td className="p-5 text-sm">
                                                                <div className="bg-slate-900 p-3 rounded-lg text-slate-300 font-mono text-xs max-w-md overflow-auto custom-scrollbar">
                                                                    {JSON.stringify(row, null, 2)}
                                                                </div>
                                                            </td>
                                                            <td className="p-5 text-right">
                                                                <button 
                                                                    onClick={() => deleteItem(row.id)}
                                                                    className="p-2 text-slate-500 hover:text-red-400 transition-colors rounded-lg hover:bg-red-400/10"
                                                                >
                                                                    <Icons.Trash />
                                                                </button>
                                                            </td>
                                                        </tr>
                                                    ))}
                                                </tbody>
                                            </table>
                                        </div>
                                    </div>
                                </>
                            )}
                        </div>
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
